name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    if: github.repository_owner == 'gillouche'
    outputs:
      is_safe: ${{ steps.gate.outputs.is_safe }}
    steps:
      - uses: actions/checkout@v4
      - uses: gillouche/homelab-ci/actions/security-gate@main
        id: gate

  test:
    name: Run Tests
    needs: security-check
    if: needs.security-check.outputs.is_safe == 'true'
    runs-on: [self-hosted, homelab-runner]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix Environment
        uses: gillouche/homelab-ci/actions/setup-nix-env@main

      - name: Run tests
        run: |
          nix develop --command bash -c '
            uv sync --all-extras --quiet
            pytest -v --cov=scripts --cov-report=term-missing
          '
