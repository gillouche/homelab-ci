[project]
name = "homelab-ci"
version = "0.0.1"
description = "Shared CI components for homelab projects"
requires-python = ">=3.10"
dependencies = [
    "ruff>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pre-commit>=4.0",
    "mypy>=1.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.coverage.run]
source = ["scripts"]
