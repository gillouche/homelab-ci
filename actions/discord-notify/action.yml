name: Discord Notify
description: Send Discord webhook notifications

inputs:
  webhook:
    description: Discord webhook URL
    required: true
  status:
    description: Status (success, failure, warning, info)
    required: true
  title:
    description: Notification title
    required: true
  message:
    description: Notification message
    required: true
  username:
    description: Bot username
    required: false
    default: Homelab CI
  url:
    description: URL for the embed title
    required: false
  fields:
    description: JSON string of fields (array of objects with name, value, inline)
    required: false
    default: '[]'

runs:
  using: composite
  steps:
    - name: Send Discord Notification
      shell: bash
      env:
        WEBHOOK: ${{ inputs.webhook }}
        STATUS: ${{ inputs.status }}
        TITLE: ${{ inputs.title }}
        MESSAGE: ${{ inputs.message }}
        USERNAME: ${{ inputs.username }}
        URL: ${{ inputs.url }}
        FIELDS: ${{ inputs.fields }}
      run: |
        case "$STATUS" in
          success)
            COLOR=3066993 # Green
            ;;
          failure)
            COLOR=15158332 # Red
            ;;
          warning)
            COLOR=16776960 # Yellow
            ;;
          *)
            COLOR=3447003 # Blue
            ;;
        esac

        # Ensure FIELDS is a valid JSON array
        FIELDS="${FIELDS:-[]}"
        if [ -z "$FIELDS" ]; then FIELDS="[]"; fi

        # Construct JSON payload with Embeds using jq
        PAYLOAD=$(jq -n \
          --arg username "$USERNAME" \
          --arg title "$TITLE" \
          --arg description "$MESSAGE" \
          --arg url "$URL" \
          --argjson fields "$FIELDS" \
          --argjson color "$COLOR" \
          '{
            username: $username,
            embeds: [{
              title: $title,
              description: $description,
              color: $color,
              url: (if $url == "" then null else $url end),
              fields: $fields
            }]
          }')

        curl -s -X POST "$WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD"
