name: Discord Notify
description: Send Discord webhook notifications

inputs:
  webhook:
    description: Discord webhook URL
    required: true
  status:
    description: Status (success, failure, warning, info)
    required: true
  title:
    description: Notification title
    required: true
  message:
    description: Notification message
    required: true
  username:
    description: Bot username
    required: false
    default: Homelab CI

runs:
  using: composite
  steps:
    - name: Send Discord Notification
      shell: bash
      run: |
        case "${{ inputs.status }}" in
          success)
            COLOR=3066993 # Green
            ;;
          failure)
            COLOR=15158332 # Red
            ;;
          warning)
            COLOR=16776960 # Yellow
            ;;
          *)
            COLOR=3447003 # Blue
            ;;
        esac

        # Construct JSON payload with Embeds using jq
        PAYLOAD=$(jq -n \
          --arg username "${{ inputs.username }}" \
          --arg title "${{ inputs.title }}" \
          --arg description "${{ inputs.message }}" \
          --argjson color "$COLOR" \
          '{
            username: $username,
            embeds: [{
              title: $title,
              description: $description,
              color: $color
            }]
          }')

        curl -s -X POST "${{ inputs.webhook }}" \
          -H "Content-Type: application/json" \
          -d "$PAYLOAD"
