name: Setup Nix Environment
description: Configure AWS credentials for Nix cache access (Nix is pre-installed in runner)

inputs:
  profile:
    description: 'Name of the AWS profile to configure'
    required: true
  access-key-id:
    description: 'AWS Access Key ID'
    required: true
  secret-access-key:
    description: 'AWS Secret Access Key'
    required: true

runs:
  using: composite
  steps:
    - name: Setup AWS Profile
      shell: bash
      run: |
        python3 "${{ github.action_path }}/../../scripts/configure_aws_profile.py" \
          --profile "${{ inputs.profile }}" \
          --access-key-id "${{ inputs.access-key-id }}" \
          --secret-access-key "${{ inputs.secret-access-key }}"

        # Mirror to root for Nix Daemon
        sudo mkdir -p /root/.aws
        sudo cp ~/.aws/credentials /root/.aws/credentials
        sudo cp ~/.aws/config /root/.aws/config

    - name: Check for Existing Nix
      id: check-nix
      shell: bash
      run: |
        if command -v nix >/dev/null 2>&1; then
          echo "nix_installed=true" >> $GITHUB_OUTPUT
          echo "Nix is already installed."
        else
          echo "nix_installed=false" >> $GITHUB_OUTPUT
          echo "Nix is not installed."
        fi

    - name: Install Nix
      if: steps.check-nix.outputs.nix_installed != 'true'
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: |
          substituters = s3://nix-cache?endpoint=http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333&scheme=http https://cache.nixos.org/
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
          require-sigs = false

    - name: Configure Nix Profile (Nix only)
      if: inputs.profile == 'nix'
      shell: bash
      run: |
        if ! grep -q "s3-creds-profile = nix" /etc/nix/nix.conf 2>/dev/null; then
          echo "s3-creds-profile = nix" | sudo tee -a /etc/nix/nix.conf
          # Restart nix-daemon to pick up changes
          if command -v systemctl >/dev/null 2>&1 && systemctl is-active nix-daemon >/dev/null 2>&1; then
            sudo systemctl restart nix-daemon
          fi
        fi
