name: Security Gate
description: Block fork PRs and validate repository ownership for self-hosted runners

inputs:
  allowed-owner:
    description: GitHub username that owns the repository
    required: false
    default: gillouche

outputs:
  is_safe:
    description: Whether the workflow is safe to run on self-hosted runners
    value: ${{ steps.check.outputs.is_safe }}

runs:
  using: composite
  steps:
    - name: Verify repository ownership
      id: check
      shell: bash
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.head.repo.fork }}" == "true" ]]; then
          echo "::error::Fork PRs cannot run on self-hosted runners"
          echo "is_safe=false" >> "$GITHUB_OUTPUT"
          exit 1
        fi

        if [[ "${{ github.repository_owner }}" != "${{ inputs.allowed-owner }}" ]]; then
          echo "::error::Repository owner mismatch - blocking execution"
          echo "is_safe=false" >> "$GITHUB_OUTPUT"
          exit 1
        fi

        echo "is_safe=true" >> "$GITHUB_OUTPUT"
