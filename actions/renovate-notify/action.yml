name: Renovate PR Notify
description: Send Discord notification when Renovate opens a PR

inputs:
  webhook:
    description: Discord webhook URL
    required: true
  pr-title:
    description: Pull request title
    required: true
  pr-url:
    description: Pull request URL
    required: true
  repo:
    description: Repository name
    required: true
  branch:
    description: Branch name
    required: true

runs:
  using: composite
  steps:
    - name: Send Renovate PR notification to Discord
      shell: bash
      run: |
        jq -n \
          --arg title "${{ inputs.pr-title }}" \
          --arg url "${{ inputs.pr-url }}" \
          --arg repo "${{ inputs.repo }}" \
          --arg branch "${{ inputs.branch }}" \
          '{
            content: "**Renovate opened a PR**",
            embeds: [{
              title: $title,
              url: $url,
              description: ("Repo: " + $repo + "\nBranch: " + $branch),
              color: 15105570
            }]
          }' | \
        curl -s -X POST \
          -H "Content-Type: application/json" \
          -d @- \
          "${{ inputs.webhook }}"
